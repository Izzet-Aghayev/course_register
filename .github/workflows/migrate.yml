name: Django Database Migration

on:
  push:
    branches: [ main ]

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu kopyala
      uses: actions/checkout@v3

    - name: Python mühitini qur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kitabxanaları quraşdır
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Miqrasiyani Aiven bazasinda birbasa icra et
      env:
        DB_NAME: 'defaultdb'
        DB_USER: 'avnadmin'
        DB_PASSWORD: 'sizin_aiven_gizli_sifreniz'
        DB_HOST: 'mysql-379baf1d-course-register-project.h.aivencloud.com'
        DB_PORT: '26233'
      run: |
        python -c "import pymysql; pymysql.install_as_MySQLdb()"
        python manage.py migrate --noinput
        python manage.py seed_data --noinput
